<style>
  /* Cabecera azul NUPROP con el logo; tarjeta marfil con los dos pasos. */
  :root {
    --marino: #011544; --marino-2: #0d2563;
    --fondo: #f6f4ef; --tarjeta: #ffffff; --borde: #e5e1d8;
    --texto: #1a2238; --suave: #5b6275; --dorado: #7d5c2e;
    --paso-fondo: #e9edf6; --ok: #1d6b43; --ok-fondo: #e3f4ea; --error: #a3261b;
    --serif: "DM Serif Display", Georgia, serif;
    --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #0b1022; --tarjeta: #131a33; --borde: #263052; --texto: #eef0f6; --suave: #a8afc4;
            --dorado: #d9c08c; --paso-fondo: #1d2850; --ok: #7fd4a4; --ok-fondo: #12301f; --error: #ff9b8f; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--sans); background: var(--fondo); color: var(--texto); line-height: 1.5; -webkit-font-smoothing: antialiased; }

  .cabecera {
    background: var(--marino); color: #fff;
    padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 96px max(20px, env(safe-area-inset-left));
    text-align: center;
  }
  .logo { display: inline-flex; align-items: center; gap: 12px; }
  .logo .flor { height: 34px; width: auto; }
  .logo .palabra { height: 22px; width: auto; }
  .cabecera h1 { font-family: var(--serif); font-weight: 400; font-size: 32px; line-height: 1.15; margin: 26px auto 10px; max-width: 420px; text-wrap: balance; }
  .cabecera p { margin: 0 auto; max-width: 380px; color: rgba(255,255,255,.78); font-size: 16px; }

  .contenido { padding: 0 max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
  .card {
    max-width: 460px; margin: -64px auto 0; background: var(--tarjeta);
    border: 1px solid var(--borde); border-radius: 20px; padding: 26px 22px;
    box-shadow: 0 10px 40px rgba(1, 21, 68, .12);
  }
  .paso { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; }
  .paso + .paso { margin-top: 26px; padding-top: 26px; border-top: 1px solid var(--borde); }
  .num {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--paso-fondo); color: var(--marino); font-family: var(--serif); font-size: 21px;
  }
  @media (prefers-color-scheme: dark) { .num { color: #fff; } }
  .paso h2 { font-size: 18px; margin: 7px 0 4px; font-weight: 700; }
  .paso p { margin: 0; color: var(--suave); font-size: 15.5px; }
  .paso b { color: var(--texto); }

  .btn {
    display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 17px;
    padding: 15px 18px; border-radius: 12px; margin-top: 14px;
    background: var(--marino); color: #fff; border: 2px solid var(--marino);
    box-shadow: 0 6px 18px rgba(1, 21, 68, .22); transition: transform .1s, background .15s;
  }
  .btn:hover { background: var(--marino-2); border-color: var(--marino-2); }
  .btn:active { transform: translateY(1px); }
  .btn.sec { background: transparent; color: var(--marino); box-shadow: none; }
  .btn.sec:hover { background: var(--paso-fondo); }
  @media (prefers-color-scheme: dark) {
    .btn { background: #f6f4ef; color: var(--marino); border-color: #f6f4ef; box-shadow: none; }
    .btn:hover { background: #fff; border-color: #fff; }
    .btn.sec { background: transparent; color: #f6f4ef; border-color: #4a5680; }
  }
  .btn:focus-visible { outline: 3px solid var(--dorado); outline-offset: 2px; }
  small { display: block; color: var(--suave); margin-top: 10px; font-size: 13px; line-height: 1.45; }

  .estado { text-align: center; padding: 8px 4px; }
  .estado h2 { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 10px 0 8px; color: var(--texto); }
  .estado p { color: var(--suave); margin: 0 0 6px; }
  .icono-ok { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-fondo); display: grid; place-items: center; margin: 4px auto 0; }
  .icono-ok svg { width: 30px; height: 30px; }
  .grande { font-size: 18px; color: var(--texto) !important; }
  .det { font-size: 11px; color: var(--suave); word-break: break-all; margin-top: 14px; }
  .volver { display: inline-block; margin-top: 16px; color: var(--suave); font-size: 14px; }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--paso-fondo); border-top-color: var(--marino); border-radius: 50%; animation: g 1s linear infinite; margin: 20px auto; }
  @media (prefers-color-scheme: dark) { .spinner { border-top-color: #f6f4ef; } }
  @keyframes g { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } .btn { transition: none; } }

  .pie { text-align: center; color: var(--suave); font-size: 12.5px; margin-top: 22px; }
</style>
</head>

  <h1 id="titulo">Conecta tu Instagram con NUPROP</h1>
  <p id="subtitulo">Son dos pasos, solo se hacen una vez y no necesitas dar tu contraseña.</p>
</header>
<main class="contenido">
  <div class="card" id="contenido"></div>
  <p class="pie">NUPROP publica tus apartamentos en tu cuenta. Puedes quitar el permiso cuando quieras desde Instagram.</p>
</main>
<script>
  const IG_APP_ID = '1341004249085344';
  const SCOPES = 'instagram_business_basic,instagram_business_content_publish';
  const SCRIPT = 'https://script.google.com/macros/s/AKfycbyziXOvuMhXfKHIJ7H691chngS1bjzVmBaY-dGJNUcPvlLE2-pQzwQaNZ2A_NZotlSNNA/exec';
  const AQUI = location.origin + location.pathname;
  const AUTH = 'https://www.instagram.com/oauth/authorize?force_reauth=true&client_id=' + IG_APP_ID +
    '&redirect_uri=' + encodeURIComponent(AQUI) + '&response_type=code&scope=' + encodeURIComponent(SCOPES);
  const el = document.getElementById('contenido');
  const params = new URLSearchParams(location.search);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const OK = '<div class="icono-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ok)"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>';

  function cabecera(titulo, sub) {
    document.getElementById('titulo').textContent = titulo;
    document.getElementById('subtitulo').textContent = sub;
  }

  function inicio() {
    el.innerHTML =
      '<div class="paso"><span class="num">1</span><div>' +
        '<h2>Acepta la invitación de NUPROP</h2>' +
        '<p>Entra, toca <b>"Invitaciones de evaluador"</b> y luego <b>"Aceptar"</b>.</p>' +
        '<a class="btn sec" target="_blank" rel="noopener" href="https://www.instagram.com/accounts/manage_access/">Aceptar invitación</a>' +
        '<small>Si se abre la app de Instagram y no ves la invitación, mantén presionado el botón, copia el enlace y ábrelo en Chrome o Safari. Cuando termines, vuelve a esta página.</small>' +
      '</div></div>' +
      '<div class="paso"><span class="num">2</span><div>' +
        '<h2>Conecta tu cuenta</h2>' +
        '<p>Entra con tu Instagram y toca <b>"Permitir"</b>.</p>' +
        '<a class="btn" href="' + AUTH + '">Conectar mi Instagram</a>' +
      '</div></div>';
  }

  async function conectar(code) {
    history.replaceState(null, '', AQUI); // que el código no quede en la barra ni se reenvíe al recargar
    cabecera('Conectando tu cuenta…', 'No cierres esta página, toma unos segundos.');
    el.innerHTML = '<div class="estado"><div class="spinner"></div><p>Conectando con Instagram…</p></div>';
    try {
      const r = await fetch(SCRIPT, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ code }) });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || 'error desconocido');
      cabecera('Cuenta conectada', 'Gracias por conectarte con NUPROP.');
      el.innerHTML = '<div class="estado">' + OK + '<h2>¡Listo! 🎉</h2><p class="grande">Tu cuenta <b>@' + esc(d.username) + '</b> quedó conectada con NUPROP.</p><p>Ya puedes cerrar esta página.</p></div>';
    } catch (err) {
      let msg = 'No se pudo conectar la cuenta. Intenta de nuevo y, si sigue fallando, avísale a NUPROP.';
      if (/insufficient|developer role|rol/i.test(String(err))) msg = 'Parece que falta aceptar la invitación (paso 1). Acéptala y vuelve a intentarlo.';
      cabecera('Algo falló', 'No te preocupes, se puede intentar de nuevo.');
      el.innerHTML = '<div class="estado"><p>' + msg + '</p><a class="btn" href="' + AUTH + '">Intentar de nuevo</a>' +
        '<a class="volver" href="' + AQUI + '">Volver al inicio</a><div class="det">' + esc(err.message || err) + '</div></div>';
    }
  }

  if (params.get('code')) conectar(params.get('code'));
  else if (params.get('error')) {
    cabecera('No se conectó', 'Se puede intentar de nuevo.');
    el.innerHTML = '<div class="estado"><p>Parece que no se tocó <b>"Permitir"</b>, o falta aceptar la invitación (paso 1).</p>' +
      '<a class="btn" href="' + AUTH + '">Intentar de nuevo</a><a class="volver" href="' + AQUI + '">Volver al inicio</a></div>';
  } else inicio();
</script>
</body>
</html>
